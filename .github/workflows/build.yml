name: Build and Release

on:
  # 日常 push / PR 跑快线：仓库此前只在打 tag 时才验证，回归只能等到发版才暴露
  # （例如 SFC 级错误 `duplicate defineExpose()`：type-check 不报、只有 vite build 才失败）。
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  # 手动触发（用于单独跑界面检查）
  workflow_dispatch:

jobs:
  # 快线：类型检查 + 单测 + 构建（不打包、不发版）
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run type-check

      # 纯 tsc 是**另一套**口径：`vue-tsc` 能解析 `.vue` 的导出，而纯 tsc 解析不了
      # （`import type { X } from './X.vue'` → TS2614）。两者都跑才能覆盖全部类型问题。
      - name: Type check (tsc, 非 SFC 口径)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (renderer + main + preload)
        # 必跑：SFC 级错误只有构建才会暴露（type-check 抓不到）
        run: npm run build

      - name: Build CLI bundle
        run: npm run build:cli

  # 界面检查：需要 Electron 与显示环境，单独一个 job；失败即阻断（它给出的"界面没问题"必须有依据）
  ui-audit:
    # 只在主分支 push / tag / 手动触发时跑：它要启动真实 Electron（有环境抖动风险），
    # 不适合阻断每个 PR；PR 走上面的 checks 快线。手动：Actions → Run workflow。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build then audit UI (light + dark)
        run: |
          npm run build
          npm run audit:ui

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: |
            .audit/ui-audit-report.md
            .audit/ui-audit-report.json
          if-no-files-found: warn

  build:
    # 只由 tag 触发：分支 push 不能去打包/发版（否则每次提交都会尝试创建 Release）
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing package.json version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # 生成 .npmrc 并把 NODE_AUTH_TOKEN 用于该 registry（否则作用域包发布 401）
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate build number
        id: build-number
        shell: bash
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Build number: $BUILD_NUMBER"

      - name: Unit tests
        run: npm test

      - name: Build Vite
        run: npm run build

      - name: Build CLI/MCP bundle
        # 安装包 extraResources 依赖 dist-cli：必须先构建，否则打包只有一条 warn 并静默缺少 resources/cli
        run: npm run build:cli

      - name: Verify CLI bundle
        shell: bash
        run: test -f dist-cli/index.js

      - name: Build Windows installer
        if: matrix.platform == 'win'
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: npx electron-builder --win --x64 --publish never

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Build macOS package
        if: matrix.platform == 'mac'
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: Upload artifacts to ShipIt-Source
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg

      - name: Publish CLI/MCP to npm
        # 仅打标签时发布；只发布打包产物（dist-cli/，CON-11），不发布源码
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'linux'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # dist-cli 已在上面的 Build CLI/MCP bundle 步骤产出
        # 注意必须是 ./dist-cli（裸 dist-cli 会被当作 registry 包名，报 404）
        run: npm publish ./dist-cli --access public

      - name: Upload artifacts to ShipIt (distribution)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repository: huberyhe/ShipIt
          token: ${{ secrets.SHIPIT_RELEASE_TOKEN }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
